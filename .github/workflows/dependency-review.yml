name: Dependency Review

on:
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  dependency-review:
    name: "Dependency Review"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Every open homeassistant advisory as of this writing is fixed
          # only in 2026.6.0, which isn't published yet — nothing newer is
          # available to pin here (see requirements.txt) — and both apply
          # to a running, network-reachable HA server (onboarding /
          # LAN-exposed integration), not to `homeassistant` as a dev/test
          # dependency driving an in-process test harness that's never
          # exposed to a network. This integration has no manifest.json HA
          # version pin at all and runs inside whatever HA core the end
          # user already has installed. Re-evaluate once a patched release
          # is available to pin:
          #   - GHSA-5hxg-r395-fqxx: path traversal via backup upload
          #     during onboarding (critical)
          #   - GHSA-x84v-g949-293w: Konnected alarm-panel state disclosed
          #     to unauthenticated actors on the LAN (high)
          allow-ghsas: |
            GHSA-5hxg-r395-fqxx
            GHSA-x84v-g949-293w
